name: Construire application Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer dépendances
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Compiler le logiciel
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Garmin_Excel_Coach gui.py
      - name: Publier le logiciel
        uses: actions/upload-artifact@v4
        with:
          name: Garmin_Excel_Coach_Windows
          path: dist/Garmin_Excel_Coach.exe
